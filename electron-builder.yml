appId: com.gobowling.leagues
productName: GoBowling Leagues
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources/templates
    to: templates
win:
  executableName: GoBowling Leagues
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  category: public.app-category.productivity
  # arm64 only - the audience is Apple Silicon. A universal build doubles both
  # build time and dmg size for a slice nobody currently runs.
  target:
    - target: dmg
      arch: arm64
  # Signed with the Developer ID in CSC_LINK and notarised through the App Store
  # Connect API key (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER).
  # Signing is not optional: an unsigned build cannot auto-update on macOS.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
# AppImage is the only common Linux format electron-updater can update in place;
# deb and rpm cannot self-update and snap needs snapcraft plus a store account.
linux:
  target: AppImage
  category: Office
npmRebuild: false
publish:
  provider: github
  # Every matrix leg uploads into the same draft. The release workflow's promote
  # job flips it live once all three succeed, so the update feed and the
  # installers it references always appear together.
  releaseType: draft
