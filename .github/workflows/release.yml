name: release

on:
  push:
    tags:
      - 'v*.*.*'
  # The macOS keychain path only misbehaves on GitHub's hardware, so it cannot be
  # validated locally. A manual run builds, signs and notarises on a real runner
  # but publishes nothing, so it costs no tag, no draft and no version number.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs first and cheaply: a mismatched version or a missing secret should fail
  # before we spend ~15 minutes of matrix build and notarisation time.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag but package.json says $pkg."
            echo "::error::Use 'npm run version' so the bump commit and the tag stay in step."
            exit 1
          fi
          echo "Releasing $pkg"

      - name: Required secrets are present
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in SENTRY_AUTH_TOKEN CSC_LINK CSC_KEY_PASSWORD \
                      APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "::error::A release without these ships unsigned or without sourcemaps; see README."
            exit 1
          fi

      # Presence is not usefulness. A Keychain Access export that selected the
      # private key rather than the certificate above it decodes and unlocks
      # fine, then fails ten minutes later inside electron-builder on both the
      # macOS and Windows legs. Reject it here instead.
      - name: Signing certificate is usable
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          p12="$RUNNER_TEMP/csc.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$p12"

          # Keychain Access still exports some bags under RC2, which OpenSSL 3
          # only reads through the legacy provider.
          provider=''
          opened=''
          for candidate in '' '-legacy'; do
            if openssl pkcs12 $candidate -in "$p12" -passin env:CSC_KEY_PASSWORD -noout 2>/dev/null; then
              provider="$candidate"
              opened='yes'
              break
            fi
          done
          if [ -z "$opened" ]; then
            echo "::error::CSC_LINK will not open with CSC_KEY_PASSWORD."
            echo "::error::Either the password is wrong or the base64 is truncated."
            exit 1
          fi

          keys="$(openssl pkcs12 $provider -in "$p12" -passin env:CSC_KEY_PASSWORD \
            -nocerts -nodes 2>/dev/null | grep -c 'BEGIN PRIVATE KEY' || true)"
          if [ "$keys" = '0' ]; then
            echo "::error::CSC_LINK holds no private key, and codesign needs one."
            echo "::error::Export the My Certificates row in Keychain Access rather than"
            echo "::error::the .cer downloaded from the developer portal."
            exit 1
          fi

          subject="$(openssl pkcs12 $provider -in "$p12" -passin env:CSC_KEY_PASSWORD \
            -nokeys -clcerts 2>/dev/null | openssl x509 -noout -subject 2>/dev/null || true)"
          if [ -z "$subject" ]; then
            echo "::error::CSC_LINK holds a private key but no certificate."
            echo "::error::In Keychain Access export the Developer ID Application row under"
            echo "::error::My Certificates, not the key nested beneath it."
            exit 1
          fi
          echo "Signing as $subject"

      # The build job decodes this into a file and hands notarytool the path.
      # A secret holding the raw PEM, the key ID, or the wrong file entirely
      # still produces a file, so the failure lands ten minutes later inside
      # notarytool as an unhelpful path error.
      - name: App Store Connect key is usable
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$key" 2>/dev/null || true
          if ! openssl pkey -in "$key" -noout 2>/dev/null; then
            echo "::error::APPLE_API_KEY does not decode to a private key."
            echo "::error::It must be base64 of the AuthKey_*.p8 file downloaded from App"
            echo "::error::Store Connect, not the raw PEM, the key ID, or a file path."
            exit 1
          fi

  checks:
    needs: verify
    uses: ./.github/workflows/checks.yml

  # Each leg publishes into the same draft release (electron-builder.yml sets
  # releaseType: draft). Nothing is visible - and no update feed is live - until
  # the promote job below flips it, so a failed leg can never leave users with a
  # latest.yml pointing at an installer that was never uploaded.
  build:
    name: build (${{ matrix.os }})
    needs: [verify, checks]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: --linux
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Given CSC_LINK, electron-builder creates its own keychain with a random
      # password, then runs `security set-key-partition-list -k <CSC_KEY_PASSWORD>`
      # against it. That is the p12 password, not the keychain password, so the
      # unlock fails and the build dies before signing. Staging the keychain here
      # avoids that path entirely: with CSC_LINK unset, macPackager falls through
      # to `process.env.CSC_KEYCHAIN` and signs from the keychain we hand it.
      #
      # Everything lands under RUNNER_TEMP rather than the workspace so no
      # credential can be swept into the packaged app.
      - name: Stage macOS signing credentials
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          key_path="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"

          p12="$RUNNER_TEMP/csc.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$p12"

          keychain="$RUNNER_TEMP/signing.keychain"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          # No arguments means no auto-lock, so the keychain cannot relock
          # part way through a long notarisation.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          # The keychain password belongs here. Passing the p12 password instead
          # is the electron-builder bug this whole step exists to work around.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign only searches the user keychain list, so prepend ours.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

          if ! security find-identity -v -p codesigning "$keychain" \
            | grep -q 'Developer ID Application'; then
            echo "::error::No Developer ID Application identity in the staged keychain."
            exit 1
          fi

          {
            echo "CSC_KEYCHAIN=$keychain"
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      # Typechecks, bundles, and uploads sourcemaps to Sentry under the release
      # name gobowling-leagues@<version>.
      - name: Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      # No signing secrets here by design. CSC_LINK must stay unset: on macOS it
      # would send electron-builder back down the broken keychain path, and on
      # Windows electron-builder falls back to it when WIN_CSC_LINK is absent and
      # tries to Authenticode sign with the Apple certificate. The macOS leg gets
      # everything it needs from the staging step above via GITHUB_ENV.
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.platform }} --publish ${{ github.event_name == 'push' && 'always' || 'never' }}

      # electron-builder logs a warning and exits 0 when notarisation is skipped,
      # so a green leg is not proof of a notarised app. The upload has already
      # happened by now, but a failure here keeps promote from running and the
      # release stays a draft.
      - name: App is signed and notarised
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          app="$(find dist -maxdepth 2 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::No .app found under dist to verify."
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$app"
          xcrun stapler validate "$app"

  promote:
    name: promote release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
