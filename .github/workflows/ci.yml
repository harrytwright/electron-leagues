name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Force-pushing a PR branch supersedes the in-flight run rather than racing it.
# Keyed on the ref so a PR run and the later push-to-main run never cancel each
# other - the main run is what you wait on before tagging a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
